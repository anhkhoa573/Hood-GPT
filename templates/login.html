<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hood GPT</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#08080c;color:#eaeaf2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(0,180,255,.15),transparent 70%);top:-250px;left:-250px;border-radius:50%;filter:blur(80px)}
.bg::after{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(140,80,255,.15),transparent 70%);bottom:-250px;right:-250px;border-radius:50%;filter:blur(80px)}
.box{position:relative;z-index:1;max-width:400px;width:100%;background:rgba(20,20,28,.9);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:36px 28px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:28px}
.mark{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#00b4ff,#8c50ff);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,180,255,.25)}
.mark svg{width:34px;height:34px;fill:#fff}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#00b4ff,#8c50ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.sub{color:#6b6b85;font-size:.82rem}
.tabs{display:flex;background:rgba(0,0,0,.3);padding:4px;border-radius:12px;margin-bottom:22px}
.tab{flex:1;padding:10px;text-align:center;border-radius:9px;font-weight:600;font-size:.85rem;color:#6b6b85;cursor:pointer;transition:all .2s;user-select:none}
.tab.active{background:linear-gradient(135deg,#00b4ff,#8c50ff);color:#fff;box-shadow:0 4px 12px rgba(0,180,255,.2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.72rem;color:#6b6b85;margin-bottom:6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.field input{width:100%;padding:13px 15px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.07);border-radius:12px;color:#eaeaf2;font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;outline:none;transition:all .2s}
.field input:focus{border-color:#00b4ff;background:rgba(0,180,255,.05);box-shadow:0 0 0 3px rgba(0,180,255,.1)}
.field input::placeholder{color:#4a4a5a}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#00b4ff,#8c50ff);color:#fff;box-shadow:0 8px 20px rgba(0,180,255,.2);transition:all .2s;margin-top:6px}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,180,255,.35)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:11px 14px;border-radius:10px;font-size:.82rem;margin-top:12px;display:none}
.msg.ok{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.25);display:block}
.msg.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;margin-top:20px;font-size:.72rem;color:#4a4a5a}
</style>
</head>
<body>
<div class="bg"></div>
<div class="box">
<div class="logo">
<div class="mark">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
</div>
<h1>Hood GPT</h1>
<p class="sub">AI chat mien phi - Nhanh - On dinh</p>
</div>
<div class="tabs">
<div class="tab active" id="tabLogin" onclick="switchTab('login')">Dang nhap</div>
<div class="tab" id="tabReg" onclick="switchTab('register')">Dang ky</div>
</div>
<div class="field">
<label>Ten dang nhap</label>
<input type="text" id="username" placeholder="Nhap ten..." autocomplete="username">
</div>
<div class="field">
<label>Mat khau</label>
<input type="password" id="password" placeholder="Nhap mat khau..." autocomplete="current-password">
</div>
<button class="btn" id="btnSubmit" onclick="submitForm()">Dang nhap</button>
<div class="msg" id="msg"></div>
<div class="foot">Powered by Groq AI</div>
</div>
<script>
var mode = "login";
function switchTab(m){
    mode = m;
    document.getElementById("tabLogin").classList.toggle("active", m === "login");
    document.getElementById("tabReg").classList.toggle("active", m === "register");
    document.getElementById("btnSubmit").textContent = m === "login" ? "Dang nhap" : "Dang ky";
    document.getElementById("msg").className = "msg";
}
async function submitForm(){
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value;
    var msg = document.getElementById("msg");
    var btn = document.getElementById("btnSubmit");
    if(!u || !p){ msg.className = "msg err"; msg.textContent = "Nhap day du thong tin!"; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Dang xu ly...';
    try{
        var res = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify({username: u, password: p, action: mode})
        });
        var data = await res.json();
        if(data.ok){
            msg.className = "msg ok"; msg.textContent = data.message;
            setTimeout(function(){ window.location.href = "/"; }, 500);
        } else {
            msg.className = "msg err"; msg.textContent = data.error;
            btn.disabled = false; btn.textContent = mode === "login" ? "Dang nhap" : "Dang ky";
        }
    } catch(e){
        msg.className = "msg err"; msg.textContent = "Loi ket noi: " + e.message;
        btn.disabled = false; btn.textContent = mode === "login" ? "Dang nhap" : "Dang ky";
    }
}
document.getElementById("password").addEventListener("keypress", function(e){ if(e.key === "Enter") submitForm(); });
</script>
</body>
</html>
