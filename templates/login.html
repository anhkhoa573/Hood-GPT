<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hood GPT - Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Outfit',sans-serif;
background:#0a0a0f;
color:#e8e8ff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
overflow:hidden;
}
.bg-blur{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-blur::before{
content:'';
position:absolute;
width:500px;height:500px;
background:radial-gradient(circle,#00d4ff,transparent 70%);
top:-200px;left:-200px;
border-radius:50%;
filter:blur(80px);
opacity:.4;
animation:move1 15s ease infinite;
}
.bg-blur::after{
content:'';
position:absolute;
width:600px;height:600px;
background:radial-gradient(circle,#a855f7,transparent 70%);
bottom:-250px;right:-250px;
border-radius:50%;
filter:blur(80px);
opacity:.4;
animation:move2 18s ease infinite;
}
@keyframes move1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
@keyframes move2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-60px)}}
.container{
position:relative;
z-index:1;
max-width:420px;
width:100%;
background:rgba(18,18,28,.85);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:40px 32px;
box-shadow:0 20px 60px rgba(0,0,0,.5);
animation:enter .5s ease;
}
@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:32px}
.logo-mark{
width:70px;height:70px;
margin:0 auto 16px;
border-radius:20px;
background:linear-gradient(135deg,#00d4ff,#a855f7);
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 30px rgba(0,212,255,.3);
}
.logo-mark svg{width:40px;height:40px;fill:#fff}
h1{
font-size:1.8rem;
font-weight:800;
background:linear-gradient(135deg,#00d4ff,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing:-.5px;
margin-bottom:6px;
}
.sub{color:#7a7a9a;font-size:.85rem}
.tabs{
display:flex;
background:rgba(0,0,0,.3);
padding:4px;
border-radius:12px;
margin-bottom:24px;
}
.tab{
flex:1;
padding:11px;
text-align:center;
border-radius:9px;
font-weight:600;
font-size:.9rem;
color:#7a7a9a;
cursor:pointer;
transition:all .25s;
user-select:none;
}
.tab.active{
background:linear-gradient(135deg,#00d4ff,#a855f7);
color:#fff;
box-shadow:0 5px 15px rgba(0,212,255,.25);
}
.field{margin-bottom:16px}
.field label{
display:block;
font-size:.78rem;
color:#7a7a9a;
margin-bottom:8px;
font-weight:600;
letter-spacing:.5px;
text-transform:uppercase;
}
.field input{
width:100%;
padding:14px 16px;
background:rgba(0,0,0,.4);
border:1px solid rgba(255,255,255,.08);
border-radius:12px;
color:#e8e8ff;
font-family:'Outfit',sans-serif;
font-size:.95rem;
outline:none;
transition:all .25s;
}
.field input:focus{
border-color:#00d4ff;
background:rgba(0,212,255,.05);
box-shadow:0 0 0 3px rgba(0,212,255,.1);
}
.field input::placeholder{color:#4a4a5a}
.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-family:'Outfit',sans-serif;
font-size:1rem;
font-weight:700;
cursor:pointer;
background:linear-gradient(135deg,#00d4ff,#a855f7);
color:#fff;
box-shadow:0 10px 25px rgba(0,212,255,.25);
transition:all .25s;
margin-top:8px;
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 35px rgba(0,212,255,.4)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:14px;display:none}
.msg.ok{background:rgba(34,197,94,.1);color:#4ade80;border:1px solid rgba(34,197,94,.3);display:block}
.msg.err{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.3);display:block}
.spinner{
display:inline-block;
width:14px;height:14px;
border:2px solid rgba(255,255,255,.3);
border-top-color:#fff;
border-radius:50%;
animation:spin .7s linear infinite;
vertical-align:middle;
margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:24px;font-size:.75rem;color:#4a4a5a}
</style>
</head>
<body>
<div class="bg-blur"></div>
<div class="container">
<div class="logo">
<div class="logo-mark">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
</div>
<h1>Hood GPT</h1>
<p class="sub">AI thông minh - Miễn phí</p>
</div>
<div class="tabs">
<div class="tab active" id="tabLogin" onclick="switchTab('login')">Đăng nhập</div>
<div class="tab" id="tabReg" onclick="switchTab('register')">Đăng ký</div>
</div>
<div class="field">
<label>Tên đăng nhập</label>
<input type="text" id="username" placeholder="Nhập tên..." autocomplete="username">
</div>
<div class="field">
<label>Mật khẩu</label>
<input type="password" id="password" placeholder="Nhập mật khẩu..." autocomplete="current-password">
</div>
<button class="btn" id="btnSubmit" onclick="submitForm()">Đăng nhập</button>
<div class="msg" id="msg"></div>
<div class="footer">Powered by Gemini AI</div>
</div>
<script>
var mode = "login";
function switchTab(m){
    mode = m;
    document.getElementById("tabLogin").classList.toggle("active", m === "login");
    document.getElementById("tabReg").classList.toggle("active", m === "register");
    document.getElementById("btnSubmit").textContent = m === "login" ? "Đăng nhập" : "Đăng ký";
    document.getElementById("msg").className = "msg";
}
async function submitForm(){
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value;
    var msg = document.getElementById("msg");
    var btn = document.getElementById("btnSubmit");
    if(!u || !p){ msg.className = "msg err"; msg.textContent = "Nhập đầy đủ thông tin!"; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Đang xử lý...';
    try{
        var res = await fetch("/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify({username: u, password: p, action: mode})
        });
        var data = await res.json();
        if(data.ok){
            msg.className = "msg ok"; msg.textContent = data.message;
            setTimeout(function(){ window.location.href = "/"; }, 600);
        } else {
            msg.className = "msg err"; msg.textContent = data.error;
            btn.disabled = false; btn.textContent = mode === "login" ? "Đăng nhập" : "Đăng ký";
        }
    } catch(e){
        msg.className = "msg err"; msg.textContent = "Lỗi kết nối: " + e.message;
        btn.disabled = false; btn.textContent = mode === "login" ? "Đăng nhập" : "Đăng ký";
    }
}
document.getElementById("password").addEventListener("keypress", function(e){ if(e.key === "Enter") submitForm(); });
</script>
</body>
</html>
